name: Publish

on:
  release:
    types: [published]
  # Manual re-runs without a new version (e.g. retrying a failed registry
  # after fixing the workflow): reads the version from package.json, so the
  # npm guard skips already-published versions automatically.
  workflow_dispatch:

jobs:
  validate:
    name: Validate (lint, typecheck, tests, self-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run self-lint

  # Registry deployments only start after the full validation job passed.
  # The two publish jobs are independent of each other: a failure in one
  # registry never blocks the other.
  publish-npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Read package version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Guard — check if the version already exists on npm
        id: guard-npm
        env:
          PACKAGE_NAME: '@projektemacher/code-citation-lint'
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require npm with OIDC support
        run: |
          echo "npm version: $(npm --version)"
          node -e "const v = process.argv[1].split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) { console.error('npm >= 11.5.1 required for OIDC trusted publishing'); process.exit(1) }" "$(npm --version)"

      - name: Publish to npm
        if: steps.guard-npm.outputs.exists != 'true'
        # Authentication via OIDC trusted publishing: no token needed.
        # Requires id-token: write (set on this job) and npm >= 11.5.1
        # (provided by Node 24). The package must trust this repository
        # on npmjs.com (Trusted Publisher: cmahnke/code-citation-lint,
        # workflow publish.yml) before the first OIDC publish.
        run: npm publish --access public --provenance

      - name: Guard result — version already on npm
        if: steps.guard-npm.outputs.exists == 'true'
        run: echo "Version ${VERSION} already exists on the npm registry — skipping publish (pass)."

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # GitHub Packages requires the npm scope to match the repository owner.
      # This repository lives under github.com/cmahnke, so the package is
      # republished there as @cmahnke/code-citation-lint (the npm package is
      # @projektemacher/code-citation-lint). If the repository moves to a
      # projektemacher GitHub organization, adjust the scope below accordingly.
      # NOTE: auth must be configured through setup-node (registry-url +
      # scope): it writes to $RUNNER_TEMP/.npmrc and points npm at it via
      # NPM_CONFIG_USERCONFIG, while a hand-written ~/.npmrc is ignored.
      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@cmahnke'
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@cmahnke/code-citation-lint"
          npm publish
